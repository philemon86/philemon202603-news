<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      2027年月曆、週曆手冊暨《臺灣傳教100周年見證集》預購說明｜腓利門書房
    </title>
    <meta
      name="description"
      content="輸入教會或祈禱所名稱，即時查詢 A、B 款月曆及 C、D 款週曆手冊訂購數量，並完成 2027 年預購表單。"
    />
    <meta
      property="og:title"
      content="2027年月曆、週曆手冊暨《臺灣傳教100周年見證集》預購說明"
    />
    <meta
      property="og:description"
      content="即時查詢教會或祈禱所訂購數量，並完成線上預購表單。"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://news.pbooks.com.tw/2027calendar/"
    />
    <meta
      property="og:image"
      content="https://news.pbooks.com.tw/2027calendar/og-v2.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main>
      <header class="site-header">
        <a class="brand" href="https://news.pbooks.com.tw/">
          <span class="brand-dot" aria-hidden="true"></span>
          PHILEMON NEWS
        </a>
        <span class="season">2027 PREORDER</span>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">2027 預購說明</p>
          <h1 id="page-title" class="long-title">
            2027年月曆、週曆手冊
            <span>
              暨《臺灣傳教100周年見證集》<br />
              預購說明
            </span>
          </h1>
          <p class="hero-lead">
            輸入教會或祈禱所名稱，即時查看目前訂購數量，再於下方完成預購表單。
          </p>
        </div>
        <div class="edition-mark" aria-hidden="true">
          <strong>27</strong>
          <span>YEAR</span>
        </div>
      </section>

      <section class="lookup-section" aria-labelledby="lookup-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">STEP 01</p>
            <h2 id="lookup-title">查詢教會訂購數量</h2>
          </div>
          <span class="record-count" id="record-count">載入資料中</span>
        </div>

        <div class="lookup-card">
          <label class="search-label" for="church-search">
            輸入教會或祈禱所關鍵字
          </label>
          <div class="search-box">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input
              id="church-search"
              type="search"
              placeholder="例如：台北、臺北、台北教会"
              autocomplete="off"
              autofocus
            />
          </div>
          <p class="instant-hint">
            支援「台／臺」及簡體中文；輸入後會直接顯示結果，不需要再按查詢。
          </p>

          <p class="lookup-message" id="lookup-message" role="status" hidden></p>

          <div id="result-area">
            <div class="lookup-placeholder">
              <span aria-hidden="true">A—D</span>
              <p>輸入名稱關鍵字，即可查看四款商品的訂購數量。</p>
            </div>
          </div>
        </div>
      </section>

      <section
        class="form-section"
        id="preorder-form"
        aria-labelledby="form-title"
      >
        <div class="section-heading form-heading">
          <div>
            <p class="section-kicker">STEP 02</p>
            <h2 id="form-title">填寫 2027 預購表單</h2>
          </div>
          <a
            href="https://docs.google.com/forms/d/e/1FAIpQLSdpO4tY6VHHhLWLpxbgnBea-atV2p2_T04Nap79WZiRvMoshQ/viewform"
            target="_blank"
            rel="noreferrer"
          >
            另開表單 ↗
          </a>
        </div>
        <div class="form-frame">
          <iframe
            src="https://docs.google.com/forms/d/e/1FAIpQLSdpO4tY6VHHhLWLpxbgnBea-atV2p2_T04Nap79WZiRvMoshQ/viewform?embedded=true"
            title="2027年月曆、週曆手冊暨《臺灣傳教100周年見證集》預購說明"
            loading="lazy"
          >
            載入中…
          </iframe>
        </div>
      </section>

      <footer>
        <span>腓利門實業股份有限公司</span>
        <a href="https://news.pbooks.com.tw/">返回 PHILEMON NEWS</a>
      </footer>
    </main>
  </body>
</html>
