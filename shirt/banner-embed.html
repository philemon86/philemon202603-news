<!-- 傳教100週年紀念衫｜直接登記 Banner：貼入原本 C296 Banner 的自訂 HTML 區塊即可 -->
<div id="philemon-shirt-banner-embed" style="width:100%;max-width:1460px;margin:0 auto;">
  <iframe id="philemon-shirt-banner-frame"
    src="https://www.philemon.com.tw/shirt/banner.html?v=20261108banner1"
    title="傳教100週年紀念衫意向登記｜可在此直接填寫"
    loading="eager" scrolling="no" referrerpolicy="strict-origin-when-cross-origin"
    style="display:block;width:100%;height:740px;border:0;background:transparent;overflow:hidden;border-radius:22px"></iframe>
</div>
<style>
@media(max-width:1100px){#philemon-shirt-banner-frame{height:850px!important}}
@media(max-width:760px){#philemon-shirt-banner-frame{height:1230px!important}}
@media(max-width:400px){#philemon-shirt-banner-frame{height:1340px!important}}
</style>
<script>
(function(){
  var frame=document.getElementById('philemon-shirt-banner-frame');
  if(!frame||frame.dataset.autosize==='true')return;
  frame.dataset.autosize='true';
  window.addEventListener('message',function(event){
    if(event.origin!=='https://www.philemon.com.tw'||event.source!==frame.contentWindow)return;
    var d=event.data||{};
    if(d.type!=='philemon-shirt-banner-height')return;
    var h=Number(d.height);
    if(Number.isFinite(h)&&h>=350&&h<=2500)frame.style.setProperty('height',Math.ceil(h)+'px','important');
  });
})();
</script>
