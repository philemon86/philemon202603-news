<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="strict-origin-when-cross-origin"><title>福音成功嶺｜活動報到</title><link rel="stylesheet" href="/campcheck/style.css"><script src="https://accounts.google.com/gsi/client" defer></script><script src="/campcheck/common.js" defer></script><script src="/campcheck/app.js" defer></script></head><body><header><div class="wrap"><small>中區大專聯契 · 2026.12.06</small><h1>福音成功嶺</h1><p>活動報到與我的行程</p></div></header><main><div id="message" class="notice" hidden></div><section id="login" class="panel"><h2>歡迎來到成功嶺</h2><p>登入 Google，選擇團契並填寫姓名，即可報到。</p><div id="google"></div><p class="muted">若 LINE 內無法登入，請以 Safari 或 Chrome 開啟。電子郵件僅供活動報到、帳號識別及同工管理，不會公開給其他學生。</p></section><section id="check" class="panel" hidden><div class="row between"><h2>選擇你的團契</h2><button class="sub btn" id="switch">換帳號</button></div><div class="muted" id="email"></div><div id="teams" class="teams"></div><label for="name">姓名</label><input id="name" autocomplete="name" placeholder="輸入中文全名" maxlength="60"><div id="onsite" hidden><p class="notice">找不到原報名名單。請先核對姓名及團契；若未報名，可直接現場加入。</p><label for="school">學校（選填）</label><input id="school" maxlength="100"><label for="major">科系（選填）</label><input id="major" maxlength="100"><button id="cancelOnsite" class="btn sub full" type="button">返回核對姓名／團契</button></div><button id="submit" class="btn full" style="margin-top:14px">完成報到</button><p class="muted" style="margin-top:10px">報到後，可查看活動名單中的姓名、團契、報到狀態及分組。若有疑問請洽現場同工。</p></section><section id="ticket" hidden><div class="success"><div>✓ 已完成報到</div><h2 id="person"></h2><div id="personTeam"></div><div id="at" style="font-size:13px"></div></div><section class="panel"><div class="row between"><h2>現在的行程</h2><span id="clock" class="clock"></span></div><div id="current" class="now"></div><div id="next" class="muted"></div></section><section class="panel"><h3>上午｜臺灣總會</h3><div id="am" class="group"></div><div id="amSchedule"></div></section><section class="panel"><h3>下午｜伸港教會</h3><div id="pm" class="group"></div><div id="pmPlace" class="muted"></div><div id="pmSchedule"></div></section><section class="panel"><h2>今天的夥伴 <span id="total" class="muted"></span></h2><div class="tabs" id="tabs"><button data-filter="all" class="active">全部</button><button data-filter="checked">已報到</button><button data-filter="team">我的團契</button><button data-filter="am">上午同組</button><button data-filter="pm">下午同組</button></div><input id="search" placeholder="搜尋姓名或團契"><div id="roster"></div></section><button class="btn sub full" id="refresh">更新分組與名單</button><button class="btn sub full" id="logout" style="margin-top:9px">登出／切換 Google 帳號</button></section><footer><a href="/camp/">原報名系統</a> · <a href="/campcheck/admin/">同工入口</a></footer></main></body></html>
