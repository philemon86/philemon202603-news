<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHILEMON NEWS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2eadf;
      --ink: #1f1a17;
      --muted: #4a3e36;
      --accent: #8c2f24;
      --border: rgba(31,26,23,0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Space Grotesk", "Noto Serif TC", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .page { max-width: 1100px; margin: 0 auto; padding: 32px clamp(18px, 4vw, 42px) 72px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; }
    .brand { font-weight: 700; letter-spacing: 0.08em; font-size: 18px; }
    nav { display: flex; gap: 18px; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
    nav a { padding: 6px 0; border-bottom: 1px solid transparent; }
    nav a:hover { border-color: var(--ink); }

    .hero { margin: 48px 0 36px; display: grid; gap: 16px; }
    .hero h1 { margin: 0; font-size: clamp(40px, 7vw, 72px); line-height: 1.02; letter-spacing: -0.01em; }
    .hero p { margin: 4px 0 18px; font-size: 18px; color: var(--muted); line-height: 1.6; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn { padding: 12px 18px; border-radius: 12px; border: 1px solid var(--ink); font-weight: 700; letter-spacing: 0.01em; transition: 0.15s ease; background: #fff; }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }

    .section { margin: 48px 0; }
    .section h2 { margin: 0 0 12px; font-size: 22px; letter-spacing: 0.02em; }
    .section small { color: var(--muted); }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .card { border: 1px solid var(--border); background: rgba(255,255,255,0.75); padding: 18px; min-height: 150px; display: grid; gap: 10px; }
    .card .label { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
    .card h3 { margin: 0; font-size: 20px; }
    .card p { margin: 0; color: var(--muted); line-height: 1.5; }

    .timeline { display: grid; gap: 10px; }
    .time-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; border-bottom: 1px solid var(--border); padding: 10px 0; }
    .time-title { font-weight: 700; }
    .muted { color: var(--muted); }

    footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .time-row { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">PHILEMON NEWS</div>
      <nav>
        <a href="#newsletter">Newsletter</a>
        <a href="#bookstore">書房 / CUP / 行李箱</a>
        <a href="#archive">Archive</a>
      </nav>
    </header>

    <section class="hero">
      <h1>腓利門電子報</h1>
      <div class="actions">
        <a class="btn primary" href="./2026-03/">閱讀 2026 三月號</a>
        <a class="btn" href="./bookstore/">參觀書房</a>
        <a class="btn" href="./cup/">杯子展示</a>
      </div>
    </section>

    <section id="newsletter" class="section">
      <h2>Newsletter</h2>
      <div class="cards" style="margin-top:12px;">
        <a class="card" href="./2026-03/">
          <div class="label">2026 · 03</div>
          <h3>三月電子報</h3>
        </a>
        <div class="card" aria-disabled="true">
          <div class="label" style="color:var(--muted);">即將上線</div>
          <h3>下一期</h3>
        </div>
      </div>
    </section>

    <section id="bookstore" class="section">
      <h2>PHILEMON 入口</h2>
      <div class="cards" style="margin-top:12px;">
        <a class="card" href="./bookstore/">
          <div class="label">書房</div>
          <h3>參觀書房</h3>
        </a>
        <a class="card" href="./cup/">
          <div class="label">CUP</div>
          <h3>杯子展示</h3>
        </a>
        <a class="card" href="./2026-luggage/">
          <div class="label">2026</div>
          <h3>行李箱</h3>
        </a>
      </div>
    </section>

    <section id="archive" class="section">
      <h2>Archive</h2>
      <div class="timeline" style="margin-top:12px;">
        <div class="time-row">
          <div class="time-title">2026 · 03</div>
          <div class="muted">三月電子報</div>
          <a class="btn" href="./2026-03/">開啟</a>
        </div>
        <div class="time-row" aria-disabled="true">
          <div class="time-title">2026 · 04</div>
          <div class="muted">四月號</div>
          <span class="muted">即將上線</span>
        </div>
        <div class="time-row" aria-disabled="true">
          <div class="time-title">2026 · 05</div>
          <div class="muted">五月號</div>
          <span class="muted">即將上線</span>
        </div>
      </div>
    </section>

    <footer>
      PHILEMON NEWS · 更新：2026 年 4 月 4 日 · GitHub Pages
    </footer>
  </div>
</body>
</html>
