<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>腓利門書本目錄 | PHILEMON NEWS</title>
  <link rel="icon" type="image/svg+xml" href="../favicon-book.svg" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: #fafafa;
      --text-main: #111111;
      --text-muted: #6f6a66;
      --text-soft: #938c86;
      --accent: #8c2f24;
      --border-color: #e7e2dd;
      --font-ui: "Helvetica Neue", Helvetica, "Microsoft JhengHei", Arial, sans-serif;
      --font-serif: "Noto Serif TC", "Source Han Serif TC", "Microsoft JhengHei", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: var(--font-ui);
      line-height: 1.5;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255,255,255,0.94);
      border-bottom: 1px solid var(--border-color);
      padding: 18px 20px 16px;
      backdrop-filter: blur(14px);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }
    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .nav {
      display: flex;
      gap: 14px;
      color: var(--text-muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .toolbar {
      display: grid;
      gap: 14px;
      font-size: 14px;
    }
    .search-input {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--border-color);
      border-radius: 0;
      background: transparent;
      padding: 9px 0;
      color: var(--text-main);
      outline: none;
    }
    .search-input:focus { border-bottom-color: var(--text-main); }
    .filters {
      display: grid;
      gap: 12px;
    }
    .filter-group {
      display: grid;
      gap: 6px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .filter-label {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
    }
    .price-options {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      overflow-x: auto;
      padding: 12px 4px 2px;
      scrollbar-width: none;
    }
    .price-options::-webkit-scrollbar { display: none; }
    .price-options::before {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      top: 22px;
      height: 2px;
      background: #111;
    }
    .price-chip {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      min-width: 42px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      padding: 0 2px;
      font-size: 11px;
      cursor: pointer;
    }
    .price-chip.active {
      color: var(--accent);
      font-weight: 700;
    }
    .price-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 0 0 2px #fff, 0 0 0 3px #111;
      transition: transform 0.2s ease;
    }
    .price-chip.active .price-dot {
      transform: scale(1.15);
    }
    .price-chip.active .price-label {
      color: var(--accent);
    }

    main {
      padding: 22px 20px 56px;
      min-height: 80vh;
    }
    .summary {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      color: var(--text-muted);
      font-size: 13px;
      overflow: hidden;
    }
    .summary strong {
      color: var(--text-main);
      font-size: 22px;
      font-weight: 700;
    }
    #updatedAt {
      display: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, calc((100vw - 55px) / 2)));
      gap: 32px 15px;
      width: 100%;
      overflow: hidden;
    }
    .book-card {
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      padding: 0;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      -webkit-appearance: none;
      appearance: none;
    }
    .book-card:hover .cover-wrapper img { transform: translateY(-2px); }
    .cover-wrapper {
      width: 100%;
      aspect-ratio: 4 / 5;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border: 1px solid #f0ece8;
      min-width: 0;
      max-width: 100%;
    }
    .cover-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.25s ease;
    }
    .book-info {
      display: grid;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }
    .book-code {
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .book-title {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .book-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }
    .tag {
      max-width: 100%;
      border: 1px solid rgba(140,47,36,0.12);
      border-radius: 999px;
      background: rgba(140,47,36,0.06);
      color: var(--accent);
      padding: 3px 7px;
      font-size: 11px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .book-price {
      color: var(--text-muted);
      font-size: 14px;
    }
    .empty-state {
      grid-column: 1 / -1;
      padding: 60px 0;
      text-align: center;
      color: var(--text-muted);
    }

    .detail-view {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .detail-view.active { transform: translateY(0); }
    .detail-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(255,255,255,0.94);
      padding: 16px 20px;
      backdrop-filter: blur(14px);
    }
    .btn-back,
    .buy-link {
      border: 0;
      background: none;
      color: var(--text-main);
      cursor: pointer;
      font-size: 14px;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .detail-content {
      display: grid;
      gap: 28px;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 30px 20px 52px;
    }
    .detail-image-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid #f0ece8;
      padding: 18px;
    }
    .detail-image {
      width: 100%;
      max-height: min(560px, 62vh);
      object-fit: contain;
    }
    .detail-text {
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-width: 0;
    }
    .detail-text h1 {
      font-family: var(--font-serif);
      font-size: 25px;
      font-weight: 600;
      line-height: 1.25;
    }
    .detail-meta {
      display: grid;
      gap: 7px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .detail-price {
      color: var(--text-main);
      font-size: 20px;
      font-weight: 700;
    }
    .detail-section {
      display: grid;
      gap: 8px;
    }
    .detail-section h2 {
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 0.08em;
    }
    .detail-section p,
    .catalog-list {
      color: var(--text-muted);
      font-family: var(--font-serif);
      font-size: 15px;
      line-height: 1.8;
    }
    .slogan-tag {
      color: var(--text-main);
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 800;
      line-height: 1.6;
    }
    .catalog-list {
      display: grid;
      gap: 5px;
      padding-left: 18px;
    }

    @media (min-width: 760px) {
      header { padding: 22px 40px 18px; }
      .topbar { margin-bottom: 20px; }
      .brand { font-size: 25px; }
      .toolbar {
        grid-template-columns: minmax(260px, 1fr) 220px 220px;
        align-items: end;
        gap: 24px;
      }
      .filters {
        display: contents;
      }
      main { padding: 40px; }
      #updatedAt { display: block; }
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 58px 30px;
      }
      .book-title { font-size: 16px; }
      .detail-header { padding: 20px 40px; }
      .detail-content {
        grid-template-columns: minmax(0, 0.92fr) minmax(360px, 0.78fr);
        gap: 60px;
        padding: 58px 40px;
      }
      .detail-text h1 { font-size: 33px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <a class="brand" href="/book/">PHILEMON BOOKS</a>
      <nav class="nav" aria-label="頁面導覽">
        <a href="/">首頁</a>
        <a href="https://www.pbooks.com.tw/collections/%E8%85%93%E5%88%A9%E9%96%80%E6%9C%AC%E7%89%88%E6%9B%B8" target="_blank" rel="noopener">書房網站</a>
      </nav>
    </div>
    <div class="toolbar">
      <div class="search-wrapper">
        <input type="search" id="searchInput" class="search-input" placeholder="搜尋書名、作者、ISBN、C 編號" />
      </div>
      <div class="filters">
        <div class="filter-group">
          <label class="filter-label">價格</label>
          <div class="price-options" id="priceOptions"></div>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="yearRange">當年度出版 <span id="yearDisplay">--</span></label>
          <input type="range" id="yearRange" min="1990" max="2026" step="1" value="2026" />
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="summary">
      <div><strong id="visibleCount">0</strong> / <span id="totalCount">0</span> 本</div>
      <span id="updatedAt"></span>
    </div>
    <section class="grid" id="bookGrid" aria-live="polite"></section>
  </main>

  <section id="detailView" class="detail-view" aria-hidden="true">
    <div class="detail-header">
      <button class="btn-back" type="button" id="closeDetail">← 返回目錄</button>
      <a class="buy-link" id="detailBuyLink" href="#" target="_blank" rel="noopener">購買</a>
    </div>
    <div class="detail-content" id="detailContent"></div>
  </section>

  <script>
    const state = { products: [], query: "", selectedPrice: "", maxYear: 0 };
    const grid = document.getElementById("bookGrid");
    const searchInput = document.getElementById("searchInput");
    const priceOptions = document.getElementById("priceOptions");
    const yearRange = document.getElementById("yearRange");
    const yearDisplay = document.getElementById("yearDisplay");
    const visibleCount = document.getElementById("visibleCount");
    const totalCount = document.getElementById("totalCount");
    const updatedAt = document.getElementById("updatedAt");
    const detailView = document.getElementById("detailView");
    const detailContent = document.getElementById("detailContent");
    const detailBuyLink = document.getElementById("detailBuyLink");
    const closeDetailBtn = document.getElementById("closeDetail");

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function numberValue(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : 0;
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleDateString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit" });
    }

    function searchableText(book) {
      return [
        book.code,
        book.title,
        book.title_clean,
        book.author,
        book.year,
        book.publication_date,
        book.isbn,
        book.slogan
      ].join(" ").toLowerCase();
    }

    function normalizeProducts(products) {
      return products.map((book) => ({
        ...book,
        price: numberValue(book.price),
        yearNumber: numberValue(book.year),
        displayTitle: book.title_clean || book.title || book.code
      }));
    }

    function setupControls(data) {
      const prices = [...new Set(state.products.map((book) => book.price).filter(Boolean))].sort((a, b) => a - b);
      const years = state.products.map((book) => book.yearNumber).filter(Boolean);
      const minYear = Math.min(...years, 1990);
      const maxYear = Math.max(...years, new Date().getFullYear());

      state.selectedPrice = "";
      state.maxYear = maxYear;
      yearRange.min = String(minYear);
      yearRange.max = String(maxYear);
      yearRange.value = String(maxYear);
      yearDisplay.textContent = String(maxYear);
      totalCount.textContent = String(state.products.length);
      updatedAt.textContent = data.updated_at ? `更新 ${formatDate(data.updated_at)}` : "";

      const options = [{ label: "全部", value: "" }, ...prices.map((price) => ({ label: `$${price}`, value: String(price) }))];
      priceOptions.innerHTML = options.map((option, index) => {
        return `
          <button class="price-chip${index === 0 ? " active" : ""}" type="button" data-price="${escapeHtml(option.value)}">
            <span class="price-dot" aria-hidden="true"></span>
            <span class="price-label">${escapeHtml(option.label)}</span>
          </button>`;
      }).join("");
      priceOptions.querySelectorAll("[data-price]").forEach((chip) => {
        chip.addEventListener("click", () => {
          state.selectedPrice = chip.dataset.price;
          priceOptions.querySelectorAll(".price-chip").forEach((item) => item.classList.toggle("active", item === chip));
          renderGrid();
        });
      });
    }

    function filteredBooks() {
      const query = state.query.trim().toLowerCase();
      return state.products.filter((book) => {
        if (query && !searchableText(book).includes(query)) return false;
        if (state.selectedPrice && String(book.price) !== state.selectedPrice) return false;
        if (book.yearNumber && book.yearNumber > state.maxYear) return false;
        return true;
      });
    }

    function renderGrid() {
      const books = filteredBooks();
      visibleCount.textContent = String(books.length);

      if (!books.length) {
        grid.innerHTML = '<div class="empty-state">找不到符合條件的書籍。</div>';
        return;
      }

      grid.innerHTML = books.map((book) => `
        <button class="book-card" type="button" data-code="${escapeHtml(book.code)}">
          <div class="cover-wrapper">
            <img src="${escapeHtml(book.image || "../favicon-book.svg")}" alt="${escapeHtml(book.displayTitle)}" loading="lazy" />
          </div>
          <div class="book-info">
            <span class="book-code">${escapeHtml(book.code)}</span>
            <h2 class="book-title">${escapeHtml(book.displayTitle)}</h2>
            <div class="book-tags">
              ${book.author ? `<span class="tag">${escapeHtml(book.author)}</span>` : ""}
              ${book.year ? `<span class="tag">${escapeHtml(book.year)}</span>` : ""}
            </div>
            ${book.price ? `<span class="book-price">$${escapeHtml(book.price)}</span>` : ""}
          </div>
        </button>
      `).join("");

      grid.querySelectorAll("[data-code]").forEach((card) => {
        card.addEventListener("click", () => openDetail(card.dataset.code));
      });
    }

    function openDetail(code) {
      const book = state.products.find((item) => item.code === code);
      if (!book) return;
      const catalog = (book.catalog || []).slice(0, 60);
      detailBuyLink.href = book.url || "#";
      detailContent.innerHTML = `
        <div class="detail-image-wrap">
          <img class="detail-image" src="${escapeHtml(book.image || "../favicon-book.svg")}" alt="${escapeHtml(book.displayTitle)}" />
        </div>
        <div class="detail-text">
          <h1>${escapeHtml(book.displayTitle)}</h1>
          <div class="detail-meta">
            <span>商品編號：${escapeHtml(book.code)}</span>
            ${book.author ? `<span>作者：${escapeHtml(book.author)}</span>` : ""}
            ${book.publication_date || book.year ? `<span>出版日期：${escapeHtml(book.publication_date || book.year)}</span>` : ""}
            ${book.pages ? `<span>頁數：${escapeHtml(book.pages)}頁</span>` : ""}
            ${book.isbn ? `<span>ISBN：${escapeHtml(book.isbn)}</span>` : ""}
            ${book.publisher ? `<span>出版社：${escapeHtml(book.publisher)}</span>` : ""}
            ${book.price ? `<span class="detail-price">$${escapeHtml(book.price)}</span>` : ""}
          </div>
          ${book.slogan ? `<p class="slogan-tag"><strong>#${escapeHtml(book.slogan.replace(/^#/, ""))}</strong></p>` : ""}
          ${book.intro ? `<section class="detail-section"><h2>商品介紹</h2><p>${escapeHtml(book.intro)}</p></section>` : ""}
          ${catalog.length ? `<section class="detail-section"><h2>目錄</h2><ol class="catalog-list">${catalog.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ol></section>` : ""}
        </div>
      `;
      document.body.style.overflow = "hidden";
      detailView.classList.add("active");
      detailView.setAttribute("aria-hidden", "false");
    }

    function closeDetail() {
      detailView.classList.remove("active");
      detailView.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    searchInput.addEventListener("input", (event) => {
      state.query = event.target.value;
      renderGrid();
    });

    yearRange.addEventListener("input", (event) => {
      state.maxYear = Number(event.target.value);
      yearDisplay.textContent = String(state.maxYear);
      renderGrid();
    });

    closeDetailBtn.addEventListener("click", closeDetail);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && detailView.classList.contains("active")) closeDetail();
    });

    fetch("./products.json")
      .then((response) => response.json())
      .then((data) => {
        state.products = normalizeProducts(data.products || []);
        setupControls(data);
        renderGrid();
      })
      .catch(() => {
        grid.innerHTML = '<div class="empty-state">書目資料載入失敗，請稍後再試。</div>';
      });
  </script>
</body>
</html>
