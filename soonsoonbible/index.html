  <style>
    /* === 1. 基礎設定 & 變數 === */
    :root {

<script>
  const trackedChapterViewKeys = new Set();

  function trackChapterViews(query, rawInput, results) {
    if (typeof gtag !== 'function' || !Array.isArray(results) || results.length === 0) return;

    const chapters = new Map();
    let searchType = 'other';

    if (query.type === 'range') {
      searchType = 'range';
      results.forEach((entry) => {
        const key = `${entry.book}:${entry.chapter}`;
        if (!chapters.has(key)) chapters.set(key, { book: entry.book, chapter: entry.chapter });
      });
    } else if (query.book && query.chapter && query.verse == null) {
      searchType = 'chapter';
      chapters.set(`${query.book}:${query.chapter}`, { book: query.book, chapter: query.chapter });
    } else {
      return;
    }

    chapters.forEach(({ book, chapter }) => {
      const dedupeKey = `${searchType}:${book}:${chapter}`;
      if (trackedChapterViewKeys.has(dedupeKey)) return;
      trackedChapterViewKeys.add(dedupeKey);

      gtag('event', 'chapter_view', {
        event_category: 'SoonSoonBible',
        event_label: `${book} ${chapter}`,
        bible_book: book,
        bible_chapter: chapter,
        chapter_key: `${book}-${chapter}`,
        chapter_label: `${book} 第${chapter}章`,
        search_type: searchType,
        search_query: rawInput,
        result_count: results.length,
        page_path: '/soonsoonbible/'
      });
    });
  }

  // === 0. 連結跳轉特效 ===

      // 顯示遮罩與動畫

      // 延遲跳轉
      setTimeout(() => {
          window.open(url, '_blank');
          
          // 跳轉後稍微等待一下再關閉遮罩 (使用者若切回來會看到消失動畫)
          setTimeout(() => {
              overlay.classList.remove('active');

  });

  // === 1. 資料庫對照表 (完整支援) ===
  const bookMap = {
    // 舊約
    '創':'Gen','創世':'Gen','創世記':'Gen',

    '尼':'Neh','尼希米':'Neh','尼希米記':'Neh', 
    '斯':'Est','以斯帖':'Est','以斯帖記':'Est', 
    '伯':'Job','約伯':'Job','約伯記':'Job',
    '詩':'Psm','詩篇':'Psm', 
    '箴':'Pro','箴言':'Pro', 
    '傳':'Ecc','傳道':'Ecc','傳道書':'Ecc',
    '歌':'Son','雅歌':'Son', 
    '賽':'Isa','以賽亞':'Isa','以賽亞書':'Isa', 
    '耶':'Jer','耶利米':'Jer','耶利米書':'Jer',
    '哀':'Lam','耶利米哀':'Lam','耶利米哀歌':'Lam', 
    '結':'Eze','以西結':'Eze','以西結書':'Eze', 
    '但':'Dan','但以理':'Dan','但以理書':'Dan',
    '何':'Hos','何西阿':'Hos','何西阿書':'Hos', 
    '珥':'Joe','約珥':'Joe','約珥書':'Joe', 
    '摩':'Amo','阿摩司':'Amo','阿摩司書':'Amo',
    '俄':'Oba','俄巴底亞':'Oba','俄巴底亞書':'Oba', 
    '拿':'Jon','約拿':'Jon','約拿書':'Jon', 
    '彌':'Mic','彌迦':'Mic','彌迦書':'Mic',
    '鴻':'Nah','那鴻':'Nah','那鴻書':'Nah', 
    '哈':'Hab','哈巴谷':'Hab','哈巴谷書':'Hab', 
    '番':'Zep','西番雅':'Zep','西番雅書':'Zep',
    '該':'Hag','哈該':'Hag','哈該書':'Hag', 
    '亞':'Zec','撒迦利亞':'Zec','撒迦利亞書':'Zec', 
    '瑪':'Mal','瑪拉基':'Mal','瑪拉基書':'Mal',
    // 新約
    '太':'Mat','馬太':'Mat','馬太福音':'Mat', '可':'Mak','馬可':'Mak','馬可福音':'Mak', 
    '路':'Luk','路加':'Luk','路加福音':'Luk', '約':'Jhn','約翰':'Jhn','約翰福音':'Jhn', 
    '徒':'Act','使徒':'Act','使徒行傳':'Act', '羅':'Rom','羅馬':'Rom','羅馬書':'Rom',
    '林前':'1Co','哥林多前':'1Co','哥林多前書':'1Co', '林後':'2Co','哥林多後':'2Co','哥林多後書':'2Co', 
    '加':'Gal','加拉太':'Gal','加拉太書':'Gal', '弗':'Eph','以弗所':'Eph','以弗所書':'Eph', 
    '腓':'Phl','腓立比':'Phl','腓立比書':'Phl', '西':'Col','歌羅西':'Col','歌羅西書':'Col',
    '帖前':'1Ts','帖撒羅尼迦前':'1Ts','帖撒羅尼迦前書':'1Ts', '帖後':'2Ts','帖撒羅尼迦後':'2Ts','帖撒羅尼迦後書':'2Ts', 
    '提前':'1Ti','提摩太前':'1Ti','提摩太前書':'1Ti', '提後':'2Ti','提摩太後':'2Ti','提摩太後書':'2Ti', 
    '多':'Tit','提多':'Tit','提多書':'Tit', '門':'Phm','腓利門':'Phm','腓利門書':'Phm',
    '來':'Heb','希伯來':'Heb','希伯來書':'Heb', '雅':'Jas','雅各':'Jas','雅各書':'Jas', 
    '彼前':'1Pe','彼得前':'1Pe','彼得前書':'1Pe', '彼後':'2Pe','彼得後':'2Pe','彼得後書':'2Pe', 
    '約一':'1Jn','約翰一':'1Jn','約翰一書':'1Jn', '約二':'2Jn','約翰二':'2Jn','約翰二書':'2Jn',
    '約三':'3Jn','約翰三':'3Jn','約翰三書':'3Jn', '猶':'Jud','猶大':'Jud','猶大書':'Jud', 
    '啟':'Rev','啟示':'Rev','啟示錄':'Rev'
  };

  const sortedBookNames = Object.keys(bookMap).sort((a, b) => b.length - a.length);

  let bibleData = [];
  let bibleReady = false;
   
  let currentKeywordResults = [];
  let currentPage = 1;
  const ITEMS_PER_PAGE = 100;
  let currentIncludeKeywords = []; 
   
  let currentVerseData = [];         
  let currentKeywordPageData = [];  
  let selectedVerses = new Set();    

  window.addEventListener('load', () => {
    const searchInput = document.getElementById('searchInput');
    const keywordInput = document.getElementById('keywordInput');
    const keywordBtn = document.getElementById('keywordBtn');
    
    document.getElementById('result').innerHTML = '<span style="color:#888">資料庫載入中...</span>';

    searchInput.addEventListener('input', debounce(searchVerse, 300));
    keywordBtn.addEventListener('click', () => initKeywordSearch());
    keywordInput.addEventListener('keydown', e => { if (e.key === 'Enter') initKeywordSearch(); });
    document.getElementById('pageInput').addEventListener('keydown', e => { if (e.key === 'Enter') jumpToPage(); });

    loadCSVWithRetry();
  });

  async function loadCSVWithRetry(maxAttempts = 3) {
    let lastErr;
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      try {
        const bust = (attempt === 1) ? '' : `?v=${Date.now()}`;
        const res = await fetch(`./bible.csv${bust}`, (attempt === 1) ? { cache: 'default' } : { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = (await res.text()).replace(/^\uFEFF/, '');
        await parseCSVInWorker(text);
        bibleReady = true;
        document.getElementById('result').innerHTML = '';
        if (document.getElementById('searchInput').value.trim()) searchVerse();
        return;
      } catch (err) { lastErr = err; await delay(300 * attempt); }
    }
    document.getElementById('result').innerHTML = `<span style="color:red">資料載入失敗。</span>`;
  }

  function parseCSVInWorker(csvText) {
    return new Promise((resolve) => {
      const workerCode = `
        self.onmessage = (e) => {
          const lines = e.data.split(/\\r?\\n/);
          const out = [];
          for (let i = 1; i < lines.length; i++) {
            const row = lines[i]; if (!row) continue;
            const parts = row.split(',');
            if (parts.length >= 4) {
              const c = parseInt(parts[1].trim());
              const v = parseInt(parts[2].trim());
              if(!isNaN(c) && !isNaN(v)){
                  out.push({
                    book: parts[0].trim(),
                    chapter: c,
                    verse: v,
                    text: parts.slice(3).join(',').trim(),
                    id: c * 1000 + v 
                  });
              }
            }
          }
          postMessage(out);
        };
      `;
      const blob = new Blob([workerCode], { type: 'application/javascript' });
      const worker = new Worker(URL.createObjectURL(blob));
      worker.onmessage = (ev) => { bibleData = ev.data || []; worker.terminate(); resolve(); };
      worker.postMessage(csvText);
    });
  }

  // === 工具函式 ===
  function numToCn(numStr) {
    const n = parseInt(numStr);
    if (isNaN(n)) return numStr;
    const digits = ['零','一','二','三','四','五','六','七','八','九'];
    if (n <= 10) return n === 10 ? '十' : digits[n];
    if (n < 20) return '十' + digits[n % 10];
    if (n < 100) {
        const ten = Math.floor(n / 10);
        const unit = n % 10;
        const result = digits[ten] + '十' + (unit === 0 ? '' : digits[unit]);
        return result;
    }
    if (n < 1000) { 
        if (n === 100) return '一百';
        if (n <= 150) {
            const h = Math.floor(n / 100);
            const rem = n % 100;
            const t = Math.floor(rem / 10);
            const u = rem % 10;
            let str = '一百';
            if (t > 0) str += digits[t] + '十';
            else if (u > 0) str += '零';
            if (u > 0) str += digits[u];
            return str;
        }
    }
    return numStr; 
  }

  function cnToNum(str) {
    if (!str) return null;
    if (/^\d+$/.test(str)) return parseInt(str, 10);
    const map = { '零':0, '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9, '十':10, '百':100 };
    if (!/[一二三四五六七八九十百]/.test(str)) return null;
    let num = 0, temp = 0; 
    for (let i = 0; i < str.length; i++) {
      const n = map[str[i]];
      if (n === undefined) continue;
      if (n === 100) { num += (temp === 0 ? 1 : temp) * 100; temp = 0; }
      else if (n === 10) { num += (temp === 0 ? 1 : temp) * 10; temp = 0; }
      else { temp = n; }
    }
    num += temp; return num;
  }

  function formatRef(englishBook, chapter, verse) {
      let shortBook = englishBook;
      try {
        const keys = Object.keys(bookMap).filter(k => bookMap[k] === englishBook);
        if (keys.length > 0) {
            keys.sort((a, b) => a.length - b.length);
            shortBook = keys[0];
        }
      } catch (e) {}
      const cnChapter = numToCn(chapter);
      return `${shortBook}${cnChapter}${verse}`;
  }

  // === ★★★ V4.8 核心修正：邏輯簡化與強化 ★★★
  function parseRefPart(str, defaultBook, defaultChapter) {
      // 1. 先從頭匹配書卷名
      let bookKey = defaultBook;
      let remain = str;
      let hasBookInStr = false; // 標記是否使用者有輸入書卷

      for (const key of sortedBookNames) {
          if (str.startsWith(key)) {
              bookKey = bookMap[key];
              remain = str.substring(key.length);
              hasBookInStr = true; // 發現書卷名
              break;
          }
      }
      
      remain = remain.replace(/[.．。,，]/g, ':');
      let c, v;
      
      let splitIdx = -1;
      const isDigit = (char) => /[0-9]/.test(char);
      const isCnDigit = (char) => /[一二三四五六七八九十百]/.test(char);
      
      // 找中文數字與阿拉伯數字的交界
      for(let i=0; i<remain.length-1; i++) {
          if(isCnDigit(remain[i]) && isDigit(remain[i+1])) {
              splitIdx = i+1; break; 
          }
      }

      if (remain.includes(':')) {
          // 有冒號: "7:2"
          const p = remain.split(':');
          c = cnToNum(p[0]) || parseInt(p[0]);
          v = cnToNum(p[1]) || parseInt(p[1]);
      } else if (splitIdx !== -1) {
          // 混合型: "一1"
          c = cnToNum(remain.substring(0, splitIdx));
          v = parseInt(remain.substring(splitIdx));
      } else {
          // 只有一段數字
          const val = cnToNum(remain) || parseInt(remain);
          
          // ★ 關鍵修正：如果這個字串裡沒有書卷名，且前面已經有章了，那這就是節！
          if (defaultChapter && !hasBookInStr) {
              c = defaultChapter;
              v = val;
          } else {
              c = val;
              v = null;
          }
      }
      
      return { 
          book: bookKey, 
          chapter: c, 
          verse: v,
          id: (c && v) ? (c * 1000 + v) : null,
          isChapterOnly: (c && !v)
      };
  }

  function parseSearchQuery(input) {
    // 1. 全域清洗
    let clean = input.replace(/\s+/g, '')
                     .replace(/[.．。,，]/g, ':') 
                     .replace(/[—~]/g, '-');

    // 2. 中文與數字分隔 (太一1 -> 太一:1)
    clean = clean.replace(/([一二三四五六七八九十百])(\d)/g, '$1:$2');

    // 3. 判斷區間
    if (clean.includes('-')) {
        const parts = clean.split('-');
        const startStr = parts[0]; 
        const endStr = parts[1];    

        const startObj = parseRefPart(startStr, null, null);
        if (!startObj.chapter) return null;

        // ★ 傳入 context: 如果 start 有 verse，則 end 的純數字應視為 verse (contextChap 有值)
        // 如果 start 只有 chapter，則 end 的純數字應視為 chapter (contextChap 為 null)
        const contextChap = startObj.verse ? startObj.chapter : null;
        
        let endBook = startObj.book;
        const endObj = parseRefPart(endStr, startObj.book, contextChap);
        
        if (!endObj.book) endObj.book = startObj.book;

        let startId = startObj.id;
        let endId = 0;

        // 計算 EndID
        if (endObj.verse) {
            // 有指定節
            endId = endObj.chapter * 1000 + endObj.verse;
        } else {
            // 只有章 -> 視為該章最後一節
            endId = endObj.chapter * 1000 + 999;
        }
        
        // 修正 Start 是整章的情況
        if (startObj.isChapterOnly) startId = startObj.chapter * 1000;

        return {
            type: 'range',
            book: startObj.book,
            startId: startId,
            endId: endId
        };

    } else {
        const obj = parseRefPart(clean, null, null);
        return {
            type: 'single',
            book: obj.book,
            chapter: obj.chapter,
            verse: obj.verse
        };
    }
  }

  // === 經文搜尋 ===
  function searchVerse() {
    const input = document.getElementById('searchInput').value.trim();
    const resultElement = document.getElementById('result');
    if (!bibleReady) return;
    resultElement.innerHTML = '';
    if (!input) return;

    const query = parseSearchQuery(input);
    if (!query) return;

    let results = [];
    let title = "";

    if (query.type === 'range') {
        results = bibleData.filter(e => 
            e.book === query.book && 
            e.id >= query.startId && 
            e.id <= query.endId
        );
        const cBookName = Object.keys(bookMap).find(k => bookMap[k] === query.book);
        if(results.length > 0) title = `<div style="margin-bottom:10px; font-weight:bold; font-size:1.1rem">區間搜尋：${input}</div>`;
        
    } else {
        // 單點
        if (query.book) {
           if (!query.chapter) return;
           results = bibleData.filter(e => e.book === query.book && e.chapter === parseInt(query.chapter) && (query.verse === null || e.verse === parseInt(query.verse)));
           const cBookName = Object.keys(bookMap).find(k => bookMap[k] === query.book);
           if (results.length > 0 && !query.verse) title = `<div style="margin-bottom:10px; font-weight:bold; font-size:1.1rem">${cBookName} 第 ${query.chapter} 章</div>`;
        } else if (query.chapter && query.verse) {
            results = bibleData.filter(e => e.chapter === parseInt(query.chapter) && e.verse === parseInt(query.verse));
            if (results.length > 0) title = `<div style="margin-bottom:10px; font-weight:bold; color:var(--primary-color)">全經卷搜尋：第 ${query.chapter} 章 第 ${query.verse} 節</div>`;
        }
    }

      if (results.length > 0) {
        currentVerseData = results; 
        trackChapterViews(query, input, results);
        let htmlBuffer = title;
        results.forEach((e, idx) => {
        const formattedRef = formatRef(e.book, e.chapter, e.verse);
        const key = JSON.stringify(e);
        const isSelected = selectedVerses.has(key) ? 'selected' : '';

        htmlBuffer += `
          <div class="result-item ${isSelected}" id="v-row-${idx}" onclick="toggleVerseSelection(${idx})">
            <div>
              <span class="verse-ref">${formattedRef}</span>
              <span class="verse-text">${e.text}</span>
            </div>
            <div class="action-bar">
               <button class="copy-btn" onclick='copySingle(event, "${e.text} (${formattedRef})")'>
                 複製
               </button>
            </div>
          </div>
        `;
      });
      resultElement.innerHTML = htmlBuffer;
    } else {
      if (query.chapter || query.type === 'range') {
          resultElement.innerHTML = '<div style="color:#999">查無經文。</div>';
      }
    }
  }

  // === 關鍵字搜尋 ===
  function initKeywordSearch() {
    let input = document.getElementById('keywordInput').value.trim();
    if (!bibleReady) return;
    if (!input) { showToast('請輸入關鍵字'); return; }
    
    input = input.replace(/([^\s])-/g, '$1 -'); 

    const rawTokens = input.split(' ').filter(t => t.trim() !== '');
    const includes = [];
    const excludes = [];
    rawTokens.forEach(token => {
      if (token.startsWith('-') && token.length > 1) excludes.push(token.substring(1));
      else includes.push(token);
    });
    
    currentIncludeKeywords = includes;

    if (includes.length === 0) {
        document.getElementById('keywordResult').innerHTML = '<div style="color:red; text-align:center;">請至少輸入一個正向關鍵字</div>';
        document.getElementById('paginationContainer').style.display = 'none';
        return;
    }

    currentKeywordResults = [];
    for (const entry of bibleData) {
      if (!includes.every(key => entry.text.includes(key))) continue;
      if (excludes.some(key => entry.text.includes(key))) continue;
      currentKeywordResults.push(entry);
    }

    if (currentKeywordResults.length === 0) {
        document.getElementById('keywordResult').innerHTML = '<div style="padding:20px; text-align:center; color:#999">找不到相關經文。</div>';
        document.getElementById('paginationContainer').style.display = 'none';
        return;
    }
    currentPage = 1;
    document.getElementById('pageInput').value = 1; 
    renderKeywordPage();
  }

  function renderKeywordPage() {
      const container = document.getElementById('keywordResult');
      const totalItems = currentKeywordResults.length;
      const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
      const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
      const endIdx = Math.min(startIdx + ITEMS_PER_PAGE, totalItems);
      
      const pageData = currentKeywordResults.slice(startIdx, endIdx);
      currentKeywordPageData = pageData; 

      const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${currentIncludeKeywords.map(esc).join('|')})`, 'gi');

      let htmlBuffer = `<div style="padding:10px 0; color:#666;">共找到 ${totalItems} 筆資料</div>`;

      pageData.forEach((entry, idx) => {
        const highlightedText = entry.text.replace(regex, '<span class="highlight">$1</span>');
        const formattedRef = formatRef(entry.book, entry.chapter, entry.verse); 

        const key = JSON.stringify(entry);
        const isSelected = selectedVerses.has(key) ? 'selected' : '';
        
        htmlBuffer += `
          <div class="result-item ${isSelected}" id="k-row-${idx}" onclick="toggleKeywordSelection(${idx})">
            <div class="verse-ref">${formattedRef}</div>
            <div class="verse-text">${highlightedText}</div>
             <div class="action-bar">
               <button class="copy-btn" onclick='copySingle(event, "${entry.text} (${formattedRef})")'>複製</button>
            </div>
          </div>
        `;
      });

      container.innerHTML = htmlBuffer;
      container.scrollIntoView({ behavior: 'smooth', block: 'start' });

      if (totalPages > 1) {
          document.getElementById('paginationContainer').style.display = 'flex';
          document.getElementById('totalPagesDisplay').textContent = totalPages;
          document.getElementById('pageInput').max = totalPages;
      } else {
          document.getElementById('paginationContainer').style.display = 'none';
      }
  }
   
  // === 選取邏輯 ===
  function toggleVerseSelection(idx) {
      const entry = currentVerseData[idx];
      if (!entry) return;
      const key = JSON.stringify(entry);
      const row = document.getElementById(`v-row-${idx}`);
      handleToggle(key, row);
  }
   
  function toggleKeywordSelection(idx) {
      const entry = currentKeywordPageData[idx];
      if (!entry) return;
      const key = JSON.stringify(entry);
      const row = document.getElementById(`k-row-${idx}`);
      handleToggle(key, row);
  }
   
  function handleToggle(key, rowElement) {
      if (selectedVerses.has(key)) {
          selectedVerses.delete(key);
          if (rowElement) rowElement.classList.remove('selected');
      } else {
          selectedVerses.add(key);
          if (rowElement) rowElement.classList.add('selected');
      }
      updateFab();
  }

  function updateFab() {
      const fab = document.getElementById('fab');
      const count = selectedVerses.size;
      document.getElementById('fabText').textContent = `已選 ${count} 節`;
      
      if (count > 0) fab.classList.add('show');
      else fab.classList.remove('show');
  }
   
  function clearSelection() {
      selectedVerses.clear();
      document.querySelectorAll('.result-item.selected').forEach(el => el.classList.remove('selected'));
      updateFab();
  }

  // === 複製核心 (同步) ===
  function copySelectedVerses() {
      if (selectedVerses.size === 0) return;
      
      let textBuffer = [];
      selectedVerses.forEach(jsonStr => {
          try {
            const e = JSON.parse(jsonStr);
            const formattedRef = formatRef(e.book, e.chapter, e.verse);
            textBuffer.push(`${e.text} (${formattedRef})`);
          } catch(err) {
            console.warn("Skip invalid");
          }
      });

      if (textBuffer.length > 0) {
        copyToClipboard(textBuffer.join('\n'), true); 
        clearSelection();
      }
  }

  function copySingle(e, text) {
      e.stopPropagation();
      copyToClipboard(text);
  }

  function jumpToPage() {
      const input = document.getElementById('pageInput');
      const totalPages = Math.ceil(currentKeywordResults.length / ITEMS_PER_PAGE);
      let val = parseInt(input.value);
      if (isNaN(val) || val < 1) val = 1;
      if (val > totalPages) val = totalPages;
      currentPage = val;
      input.value = val; 
      renderKeywordPage();
  }

  window.jumpToPage = jumpToPage;
  window.copySingle = copySingle;
  window.copySelectedVerses = copySelectedVerses;
  window.toggleVerseSelection = toggleVerseSelection;
  window.toggleKeywordSelection = toggleKeywordSelection;
  window.clearSelection = clearSelection;

  function copyToClipboard(text, isBatch = false) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = 0;
    document.body.appendChild(ta);
    ta.select();
    try {
      const successful = document.execCommand('copy');
      if (successful) {
          showToast(isBatch ? `已複製 ${selectedVerses.size} 節` : '已複製');
      } else {
          showToast('複製失敗');
      }
    } catch (err) {
      showToast('複製失敗');
    }
    document.body.removeChild(ta);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show';
    setTimeout(() => { t.className = t.className.replace('show', ''); }, 3000);
  }
  function debounce(fn, w = 200) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), w); }; }
  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
