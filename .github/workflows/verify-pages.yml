name: Verify Pages

on:
  workflow_run:
    workflows:
      - Deploy Pages
    types:
      - completed

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Verify published pages
        shell: bash
        run: |
          set -euo pipefail

          urls=(
            "https://philemon.com.tw/"
            "https://philemon.com.tw/timeline/"
            "https://philemon.com.tw/404.html"
            "https://philemon.com.tw/c293/"
          )

          for url in "${urls[@]}"; do
            ok=0
            for attempt in {1..18}; do
              status=$(curl -L -s -o /tmp/page.out -w "%{http_code}" "$url" || true)
              body=$(tr '\n' ' ' < /tmp/page.out)

              if [[ "$url" == *"/404.html" ]]; then
                if [[ "$status" == "200" && "$body" == *"LOST ROUTE"* ]]; then
                  ok=1
                  break
                fi
              elif [[ "$url" == *"/timeline/" ]]; then
                if [[ "$status" == "200" && "$body" == *"history-map"* ]]; then
                  ok=1
                  break
                fi
              elif [[ "$url" == *"/c293/" ]]; then
                if [[ "$status" == "200" && "$body" == *"products/c293"* ]]; then
                  ok=1
                  break
                fi
              else
                if [[ "$status" == "200" && "$body" == *"PHILEMON NEWS"* ]]; then
                  ok=1
                  break
                fi
              fi

              sleep 10
            done

            if [[ "$ok" -ne 1 ]]; then
              echo "Verification failed for $url"
              echo "HTTP status: $status"
              cat /tmp/page.out
              exit 1
            fi
          done

      - name: Verify newsletter images
        shell: bash
        run: |
          set -euo pipefail

          images=(
            "https://philemon.com.tw/2026-11/assets/c296-02.webp"
            "https://philemon.com.tw/2026-11/assets/c299.webp"
          )

          for url in "${images[@]}"; do
            ok=0
            for attempt in {1..18}; do
              headers=$(mktemp)
              body=$(mktemp)
              status=$(curl -L -sS -D "$headers" -o "$body" -w "%{http_code}" "$url" || true)
              ctype=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' "$headers" | tail -n1)

              if [[ "$status" == "200" && "$ctype" == image/webp* && -s "$body" ]]; then
                echo "OK $url -> $status $ctype $(wc -c < "$body") bytes"
                ok=1
                rm -f "$headers" "$body"
                break
              fi

              echo "Attempt $attempt failed: $url -> $status $ctype"
              rm -f "$headers" "$body"
              sleep 10
            done

            if [[ "$ok" -ne 1 ]]; then
              echo "Image verification failed for $url"
              exit 1
            fi
          done
