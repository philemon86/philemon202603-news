name: Complete GA4 public-page coverage and reorder November books

on:
  push:
    branches: [master]
    paths:
      - "scripts/apply_ga4_coverage_20261112.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ga4-coverage-20261112
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply GA4 migration and descending November book order
        run: python scripts/apply_ga4_coverage_20261112.py
      - name: Validate script syntax and changes
        run: |
          python -m py_compile scripts/apply_ga4_coverage_20261112.py
          test -s docs/ga4-coverage-20261112.json
          grep -q "G-JD1JHF86H1" docs/ga4-coverage-20261112.json
          grep -q "ga4-unified.js" c300/index.html
          grep -q "ga4-unified.js" c296/index.html
          grep -q "ga4-unified.js" 2026-11/en.html
          grep -q "ga4-unified.js" 2026-09/index.html
          git diff --stat
      - name: Commit tested pages and tracking report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 2026-03/ 2026-04/ 2026-05/ 2026-06/ 2026-08/ 2026-09/ 2026-11/ c002/ c136/ c185/ c290/ c291/ c292/ c293/ c294/ c295/ c296/ c297/ c298/ c299/ c300/ cup/ 2026-luggage/ book/ bookstore/ first/ timeline/ shirt/ 2027calendar/ soonsoonbible/ docs/ga4-coverage-20261112.json
          git diff --cached --quiet || git commit -m "Deploy consistent GA4 coverage and C300-C296 descending newsletter carousel"
          git push
