name: Update SoonSoonBible Rankings

on:
  push:
    branches:
      - master
    paths:
      - ".github/scripts/fetch_soonsoonbible_rankings.py"
      - ".github/workflows/soonsoonbible-rankings.yml"
      - "soonsoonbible/index.html"
      - "soonsoonbible/rankings.json"
      - "soonsoonbible/visitor-count.json"
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: write

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests

      - name: Fetch GA4 rankings
        env:
          GA4_PROPERTY_ID: "537269601"
          GA4_LOOKBACK_DAYS: "30"
          GA4_VISITOR_COUNT_START_DATE: "2026-05-12"
          GA4_QUALIFIED_VISITOR_START_DATE: "2026-07-15"
          GA4_SOONSOON_PAGE_PATH: "/soonsoonbible/"
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          RANKINGS_OUTPUT_PATH: "soonsoonbible/rankings.json"
          VISITOR_COUNT_OUTPUT_PATH: "soonsoonbible/visitor-count.json"
        run: python .github/scripts/fetch_soonsoonbible_rankings.py

      - name: Commit rankings update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soonsoonbible/rankings.json soonsoonbible/visitor-count.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update soonsoonbible rankings"
          git push
