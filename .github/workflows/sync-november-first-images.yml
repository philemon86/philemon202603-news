name: Capture first product photos for November arrivals

on:
  push:
    branches: [master]
    paths:
      - "scripts/sync_arrival_first_images_20261111.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: november-first-product-photo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 Pillow
      - name: Download first original product photos and replace illustrative cards
        run: python scripts/sync_arrival_first_images_20261111.py
      - name: Commit actual optimized images and three-language HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026-11/index.html 2026-11/zh-cn.html 2026-11/en.html 2026-11/assets/arrivals/
          git diff --cached --quiet || git commit -m "Replace four November arrivals illustrations with first real CYBERBIZ product photos"
          git push
