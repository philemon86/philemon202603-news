<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>找不到頁面 | PHILEMON NEWS</title>
    <script>
      (function () {
        var path = (location.pathname || "").toLowerCase();
        if (path === "/c002" || path === "/c002/") {
          location.replace("/c002/");
          return;
        }
        if (path === "/c292" || path === "/c292/") {
          location.replace("/c292/");
          return;
        }
        if (path === "/c293" || path === "/c293/") {
          location.replace("/C293/");
          return;
        }
        if (path === "/c185" || path === "/c185/" || path === "/C185" || path === "/C185/") {
          location.replace("/c185/");
          return;
        }
        if (path === "/2026-06" || path === "/2026-06/") {
          location.replace("/2026-06/");
          return;
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon-news.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Manrope:wght@400;500;700;800&family=Noto+Serif+TC:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f7efe0;
        --paper-strong: #fff9ef;
        --ink: #183028;
        --muted: #66756a;
        --green: #0f3f2f;
        --gold: #d9a441;
        --line: rgba(24, 48, 40, 0.1);
        --shadow: 0 26px 70px rgba(30, 42, 31, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Manrope", "Noto Serif TC", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 12%, rgba(217, 164, 65, 0.24), transparent 20rem),
          radial-gradient(circle at 88% 8%, rgba(15, 63, 47, 0.12), transparent 22rem),
          linear-gradient(135deg, #fff9ef 0%, #f4ead7 52%, #ede1ca 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.22;
        background-image:
          linear-gradient(rgba(24, 48, 40, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(24, 48, 40, 0.04) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(to bottom, black, transparent 82%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .panel {
        width: min(920px, 100%);
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 32px;
        background: rgba(255, 249, 239, 0.78);
        backdrop-filter: blur(14px);
        box-shadow: var(--shadow);
      }

      .topline {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 32px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--green);
        color: #fff7e6;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.84rem;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .brand::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--gold);
      }

      .status {
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(217, 164, 65, 0.16);
        color: #8a5817;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 28px;
        align-items: center;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #9a6b27;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: "Noto Serif TC", serif;
        font-size: clamp(2.4rem, 8vw, 4.8rem);
        line-height: 1.05;
      }

      .lead {
        margin: 18px 0 0;
        color: var(--muted);
        line-height: 1.9;
      }

      .path-box {
        margin-top: 22px;
        padding: 16px 18px;
        border-radius: 20px;
        background: rgba(15, 63, 47, 0.05);
        border: 1px dashed rgba(15, 63, 47, 0.16);
      }

      .path-box strong,
      .path-box code {
        font-family: "JetBrains Mono", monospace;
      }

      .path-box code {
        display: block;
        margin-top: 8px;
        color: var(--green);
        word-break: break-all;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 26px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 999px;
        font-weight: 800;
        border: 1px solid transparent;
      }

      .btn-primary {
        background: var(--green);
        color: #fff7e6;
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.62);
        border-color: rgba(15, 63, 47, 0.12);
      }

      .card-stack {
        display: grid;
        gap: 14px;
      }

      .card {
        padding: 18px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.58);
        border: 1px solid rgba(15, 63, 47, 0.08);
      }

      .card strong {
        display: block;
        margin-bottom: 8px;
        font-size: 1rem;
      }

      .card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.8;
      }

      .card code {
        font-family: "JetBrains Mono", monospace;
        color: var(--green);
      }

      @media (max-width: 760px) {
        .panel {
          padding: 20px;
          border-radius: 24px;
        }

        .topline,
        .grid,
        .actions {
          grid-template-columns: 1fr;
        }

        .topline {
          display: grid;
        }

        .actions {
          display: grid;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="panel">
        <div class="topline">
          <div class="brand">PHILEMON NEWS</div>
          <div class="status">404 / LOST ROUTE</div>
        </div>

        <div class="grid">
          <div>
            <p class="eyebrow">Page Not Found</p>
            <h1>這一站<br />暫時沒有書房</h1>
            <p class="lead">
              你要前往的頁面沒有停靠在這裡。可能是網址打錯了，也可能是頁面已經換了路線。
            </p>

            <div class="path-box">
              <strong>目前路徑</strong>
              <code id="missing-path">/</code>
            </div>

            <div class="actions">
              <a class="btn btn-primary" href="/">回到首頁</a>
              <a class="btn btn-secondary" href="/book/">看出版品</a>
              <a class="btn btn-secondary" href="/timeline/">看書展時光</a>
            </div>
          </div>

          <div class="card-stack">
            <div class="card">
              <strong>你可以先去這裡</strong>
              <p>首頁整理了電子報、出版品、音樂與各種入口，通常最快找到你要的內容。</p>
            </div>
            <div class="card">
              <strong>如果你是從舊連結進來</strong>
              <p>有些頁面可能已改成新的網址格式，例如書籍頁可能區分大小寫。</p>
            </div>
            <div class="card">
              <strong>目前支援的特別轉址</strong>
              <p><code>/c293</code> 會自動轉到 <code>/C293/</code>。</p>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script>
      var pathEl = document.getElementById("missing-path");
      if (pathEl) {
        pathEl.textContent = location.pathname || "/";
      }
    </script>
  </body>
</html>
